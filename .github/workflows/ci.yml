name: Core and GUI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg and Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install -r requirements-core.txt -e ".[dev]"
      - name: CPU torch for tensor reuse and simulated OOM tests
        run: python -m pip install "torch>=2.6,<3" "torchvision>=0.21,<1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src
      - run: python -m pytest -q -m "not rife" --junitxml=test-artifacts/ci.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Collect environment and encoder diagnostics
        if: always()
        run: |
          python -c "from pathlib import Path; Path('test-artifacts').mkdir(exist_ok=True)"
          python -m animecinemavfi diagnose --encoders --output test-artifacts/diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-py311
          path: test-artifacts/*
